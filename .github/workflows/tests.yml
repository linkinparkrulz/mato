name: Tests

# The gate CONTRIBUTING.md describes, run by GitHub instead of by hand: three
# installs, a type check, four suites, and the instance-data checksums.
#
# It runs on pull requests and on pushes to main. The push trigger is the one
# that matters here, because deploy.yml fires on the same push and does not wait
# for this: a red tick beside a deployed commit is later than anybody would like
# but is still the only signal there is. Making the deploy depend on this job is
# a separate decision, since it trades a slower deploy for a tested one.
#
# Node 24 because that is what the boxes run and what package.json requires.
# There is no dependency cache: two lockfiles in two directories is enough
# fiddliness to be worth avoiding for a job that installs in well under a minute.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Reads the tree and writes nothing back, so the token needs nothing else.
# Stated rather than inherited, for the reasons deploy.yml gives at length.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Three installs, not one. The root brings in TypeScript and @types/node;
      # server and gateway bring in the runtime dependencies the checker must
      # also resolve. Without them, tsc reports missing @dojo-tools and
      # @bitcoinerlab modules and the tree looks broken when it is not. The
      # gateway install is the one that is easy to forget: it arrived after this
      # file did, and its absence surfaces as nine TS2307 errors in the type
      # check rather than as anything naming the gateway.
      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Install (server)
        run: npm ci --no-audit --no-fund
        working-directory: server

      - name: Install (gateway)
        run: npm ci --no-audit --no-fund
        working-directory: gateway

      # The instance-owned files must be byte-identical afterwards. A suite that
      # mutates them is a bug in the suite, and one that nothing else here would
      # notice: every suite would still pass.
      #
      # dojos.json and the two history files were this list until the fork: all
      # three are generated by a running instance and none survived the clean
      # root, so sha256sum exited 1 on a missing file and took the whole job
      # down before a single test ran. What is left is what a fresh clone has:
      # the anchor the backend suite reads, and the version file the front end
      # fetches. Add the generated files back here if this instance starts
      # producing them.
      - name: Record instance-data checksums
        run: sha256sum data/seed.json data/version.json > "$RUNNER_TEMP/before.sha"

      - name: Type check
        run: npm run typecheck

      - name: Updater and installer suite
        run: node scripts/selftest.mjs

      - name: Backend suite
        run: node selftest.mjs
        working-directory: server

      # Holds the derivation against BIP47's published specification vectors,
      # which is the part of this repository where being subtly wrong costs
      # somebody their money rather than a red tick.
      - name: Gateway suite
        run: node selftest.mjs
        working-directory: gateway

      # jsdom is installed outside the workspace, exactly as a developer does it,
      # so the front end and scripts/ stay dependency-free. E2E_DIR is what the
      # harness reads; RUNNER_TEMP rather than /tmp so nothing assumes a path
      # that a self-hosted runner might not have.
      - name: Install jsdom outside the tree
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          npm init -y > /dev/null
          npm install jsdom --no-audit --no-fund

      - name: Front-end harness
        run: node scripts/e2e-harness.mjs
        env:
          E2E_DIR: ${{ runner.temp }}/e2e

      - name: Instance data unchanged
        run: sha256sum -c "$RUNNER_TEMP/before.sha"
